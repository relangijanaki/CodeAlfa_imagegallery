<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Responsive Image Gallery</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#111;
      color:white;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:20px;
      font-size:40px;
      color:#fff;
    }

    /* Filter Buttons */
    .filter-buttons{
      text-align:center;
      margin-bottom:25px;
    }

    .filter-buttons button{
      padding:10px 20px;
      margin:5px;
      border:none;
      background:#333;
      color:white;
      cursor:pointer;
      border-radius:8px;
      transition:0.3s;
    }

    .filter-buttons button:hover,
    .filter-buttons .active{
      background:#ff4d4d;
      transform:scale(1.05);
    }

    /* Gallery Layout */
    .gallery{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .gallery-item{
      position:relative;
      overflow:hidden;
      border-radius:15px;
      cursor:pointer;
      transition:0.4s;
    }

    .gallery-item img{
      width:100%;
      height:250px;
      object-fit:cover;
      transition:0.5s;
      display:block;
    }

    /* Hover Effect */
    .gallery-item:hover img{
      transform:scale(1.1);
      filter:brightness(70%);
    }

    .gallery-item .overlay{
      position:absolute;
      bottom:-100%;
      left:0;
      width:100%;
      background:rgba(0,0,0,0.7);
      color:white;
      text-align:center;
      padding:15px;
      transition:0.4s;
    }

    .gallery-item:hover .overlay{
      bottom:0;
    }

    /* Lightbox */
    .lightbox{
      display:none;
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.9);
      justify-content:center;
      align-items:center;
      z-index:1000;
      flex-direction:column;
    }

    .lightbox img{
      width:80%;
      max-width:800px;
      border-radius:10px;
      animation:zoom 0.4s ease;
    }

    @keyframes zoom{
      from{
        transform:scale(0.5);
      }
      to{
        transform:scale(1);
      }
    }

    .close{
      position:absolute;
      top:20px;
      right:35px;
      font-size:40px;
      cursor:pointer;
      color:white;
    }

    .nav-buttons{
      margin-top:20px;
    }

    .nav-buttons button{
      padding:12px 20px;
      margin:0 10px;
      border:none;
      border-radius:8px;
      background:#ff4d4d;
      color:white;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    .nav-buttons button:hover{
      background:#ff1a1a;
      transform:scale(1.05);
    }

    /* Responsive */
    @media(max-width:768px){
      h1{
        font-size:28px;
      }

      .lightbox img{
        width:95%;
      }
    }
  </style>
</head>

<body>

  <h1>Image Gallery</h1>

  <!-- Filter Buttons -->
  <div class="filter-buttons">
    <button class="active" onclick="filterImages('all')">All</button>
    <button onclick="filterImages('nature')">Nature</button>
    <button onclick="filterImages('city')">City</button>
    <button onclick="filterImages('animals')">Animals</button>
  </div>

  <!-- Gallery -->
  <div class="gallery">

    <div class="gallery-item nature">
      <img src="https://picsum.photos/id/1015/600/400" alt="Nature">
      <div class="overlay">Beautiful Nature</div>
    </div>

    <div class="gallery-item city">
      <img src="https://picsum.photos/id/1011/600/400" alt="City">
      <div class="overlay">City View</div>
    </div>

    <div class="gallery-item animals">
      <img src="https://picsum.photos/id/1025/600/400" alt="Animal">
      <div class="overlay">Cute Animal</div>
    </div>

    <div class="gallery-item nature">
      <img src="https://picsum.photos/id/1040/600/400" alt="Nature">
      <div class="overlay">Mountain Nature</div>
    </div>

    <div class="gallery-item city">
      <img src="https://picsum.photos/id/1031/600/400" alt="City">
      <div class="overlay">Night City</div>
    </div>

    <div class="gallery-item animals">
      <img src="https://picsum.photos/id/237/600/400" alt="Animal">
      <div class="overlay">Dog Image</div>
    </div>

  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <span class="close">&times;</span>
    <img id="lightbox-img" src="">
    
    <div class="nav-buttons">
      <button id="prev">Prev</button>
      <button id="next">Next</button>
    </div>
  </div>

  <script>
    const galleryImages = document.querySelectorAll('.gallery-item img');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const closeBtn = document.querySelector('.close');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    let currentIndex = 0;

    // Open Lightbox
    galleryImages.forEach((img, index) => {
      img.addEventListener('click', () => {
        currentIndex = index;
        showImage();
        lightbox.style.display = 'flex';
      });
    });

    // Show Current Image
    function showImage() {
      lightboxImg.src = galleryImages[currentIndex].src;
    }

    // Next Image
    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % galleryImages.length;
      showImage();
    });

    // Previous Image
    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
      showImage();
    });

    // Close Lightbox
    closeBtn.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });

    // Close when clicking outside image
    lightbox.addEventListener('click', (e) => {
      if(e.target !== lightboxImg){
        lightbox.style.display = 'none';
      }
    });

    // Filter Function
    function filterImages(category) {
      const items = document.querySelectorAll('.gallery-item');
      const buttons = document.querySelectorAll('.filter-buttons button');

      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      items.forEach(item => {
        if(category === 'all'){
          item.style.display = 'block';
        } else {
          if(item.classList.contains(category)){
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        }
      });
    }
  </script>

</body>
</html>
